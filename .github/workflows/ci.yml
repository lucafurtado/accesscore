# Frontend CI steps will be added in Milestone 4.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: accesscore
          POSTGRES_PASSWORD: accesscore
          POSTGRES_DB: accesscore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check . --output-format=github

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy app

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=0
        env:
          DATABASE_URL: postgresql+asyncpg://accesscore:accesscore@localhost:5432/accesscore_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-exactly-32-chars-xx
          DEBUG: "true"
          CORS_ORIGINS: '["http://localhost:3000"]'
